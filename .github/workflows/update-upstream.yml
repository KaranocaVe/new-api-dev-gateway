name: Update upstream release
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-release-pr
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify exact Linux assets and update lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release.py
      - name: Create or update one review PR and dispatch its tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- release.json; then
            exit 0
          fi
          branch=automation/upstream-release
          tag=$(python3 -c 'import json; print(json.load(open("release.json"))["tag"])')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git checkout -b "$branch"
          git add release.json
          git commit -m "Update official New API to $tag"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          python3 - <<'PY'
          import json, pathlib
          lock = json.load(open('release.json'))
          body = ('Update the locked official New API release to ' + lock['tag'] + '.\n\n'
                  'Both exact Linux assets were downloaded, checked against official SHA-256 values '
                  'and verified as ELF64 for their respective architectures.\n\n'
                  'The CI workflow is explicitly dispatched because PRs created with GITHUB_TOKEN '
                  'do not trigger pull_request workflows. Review both architecture checks before merging. '
                  'Back up state before deploying the update; upstream migrations can prevent downgrades.\n')
          pathlib.Path('/tmp/upstream-pr.md').write_text(body)
          PY
          existing=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Update New API to $tag" --body-file /tmp/upstream-pr.md
          else
            gh pr create --base main --head "$branch" --title "Update New API to $tag" --body-file /tmp/upstream-pr.md
          fi
          gh workflow run ci.yml --ref "$branch"
