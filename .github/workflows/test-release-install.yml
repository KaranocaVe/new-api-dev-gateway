name: Test published installation
on:
  workflow_dispatch:
    inputs:
      version:
        description: CLI release tag to install
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  install:
    name: Published install ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install release as ordinary runner user
        env:
          CLI_VERSION: ${{ inputs.version }}
          GATEWAY_INSTALL_DIR: ${{ runner.temp }}/gateway-cli
        run: |
          test "$(id -u)" -ne 0
          sh scripts/install.sh "$CLI_VERSION"
      - name: Exercise installed release without Go
        env:
          GATEWAY_BIN: ${{ runner.temp }}/gateway-cli/new-api-gateway
        run: python3 tests/integration.py
